name: Release

# Start it from the Actions tab (or from a chat) on main with the version to publish, for example 2026.10.3:
# GitHub creates the tag v<version> on the tip of main and publishes the release. The site copies the app from that tag.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (the one in app.js and sw.js, for example 2026.10.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The version is the one in the code, new and higher than the latest tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          TAG="${RELEASE_VERSION#v}"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::A release must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::The version must look like 2026.10.3 (year.month.number)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$TAG" >/dev/null 2>&1; then
            echo "::error::Tag v$TAG already exists: use a higher version"; exit 1
          fi
          VERSION=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app.js)
          CACHE=$(sed -n 's/^const CACHE_VERSION = "v\([^"]*\)".*/\1/p' sw.js)
          echo "app.js: $VERSION  sw.js: $CACHE  requested: $TAG"
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$CACHE" ]; then
            echo "::error::The requested version must be the VERSION in app.js and the CACHE_VERSION in sw.js"; exit 1
          fi
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          echo "latest tag: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$TAG" "$LATEST" || { echo "::error::Version $TAG must be greater than the latest tag v$LATEST"; exit 1; }
          fi

      - name: Tests
        run: node --test dev/*.test.js

      - name: Publish the release (creates the tag on main)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Show Notes AI ${{ github.event.inputs.release_version }}
          body: |
            Show Notes AI ${{ github.event.inputs.release_version }}: a free web app, no account, nothing to install.
            Open it at https://onairgarage.com/tools/show-notes-ai/
